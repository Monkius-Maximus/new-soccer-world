name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SoccerDreamGame.sln

      - name: Build
        run: dotnet build SoccerDreamGame.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SoccerDreamGame.sln --configuration Release --no-build --no-restore

      - name: Build world template
        run: dotnet run --project tools/SoccerSim.WorldBuilder/SoccerSim.WorldBuilder.csproj --configuration Release --no-build -- --output artifacts/world_template.db

      - name: Run deterministic headless slice
        run: dotnet run --project tools/SoccerSim.HeadlessRunner/SoccerSim.HeadlessRunner.csproj --configuration Release --no-build -- --template artifacts/world_template.db --seed 123456789

      # Runs the PERF-001 harness and applies the order-of-magnitude guard ADR-0008 asks CI
      # for. Still NOT the criterion measurement: that is fixed to the reference machine and
      # these numbers come from a shared runner. The ceiling is ten times the per-match
      # budget, and this step runs alone - a wall-clock measurement taken inside `dotnet
      # test` competes with the other test assemblies and reads an order of magnitude slow.
      - name: Benchmark harness + regression guard (not the criterion measurement)
        run: dotnet run --project tools/SoccerSim.Benchmark/SoccerSim.Benchmark.csproj --configuration Release --no-build -- --template artifacts/world_template.db --matches 10 --warmup 3 --max-ms-per-match 1000

  godot-smoke:
    name: Godot smoke test (headless)
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_PACKAGE: Godot_v4.7.1-stable_mono_linux_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_PACKAGE}.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Run the Godot smoke test
        run: |
          chmod +x "$HOME/godot/${GODOT_PACKAGE}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          scripts/godot-smoke-test.sh "$HOME/godot/${GODOT_PACKAGE}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"

  godot-export:
    name: Godot release export (both 1.0 targets)
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_PACKAGE: Godot_v4.7.1-stable_mono_linux_x86_64
      GODOT_TEMPLATE_VERSION: 4.7.1.stable.mono

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_PACKAGE}.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"

      - name: Export and run the release build
        run: |
          chmod +x "$HOME/godot/${GODOT_PACKAGE}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          scripts/godot-export-test.sh "$HOME/godot/${GODOT_PACKAGE}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soccerdreamgame-desktop-builds
          path: artifacts/export/
          retention-days: 7
